<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>달토끼 송편 잡기</title>
  
  <!-- Firebase SDK (Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Jua', sans-serif;
    }

    body {
      background-color: #1a1a24;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100vw;
      max-width: 420px;
      height: 100vh;
      max-height: 860px;
      background: #141c2b;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(0,0,0,0.8);
      border-radius: 14px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 상단 인게임 UI 바 */
    #top-ui {
      position: absolute;
      top: max(24px, calc(env(safe-area-inset-top, 0px) + 14px));
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 12px;
      pointer-events: none;
      z-index: 10;
    }

    .ui-pill {
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #5d3a1a;
      border-radius: 25px;
      padding: 5px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.15rem;
      color: #4a2810;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }

    .ui-label-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ui-icon {
      width: 24px;
      height: 24px;
      display: inline-block;
      vertical-align: middle;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15));
    }

    .ui-pill.fever-timer {
      border-color: #ff2a4b;
      color: #ff1f3d;
      animation: fever-blink 0.4s infinite alternate;
    }

    @keyframes fever-blink {
      from { transform: scale(1); }
      to { transform: scale(1.1); background: #ffe3e3; }
    }

    /* 피버 배너 */
    #fever-banner {
      position: absolute;
      top: max(82px, calc(env(safe-area-inset-top, 0px) + 72px));
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #ff3838, #ffb300);
      color: white;
      padding: 6px 18px; 
      border-radius: 30px;
      border: 3px solid #ffffff;
      font-size: 1.15rem; 
      white-space: nowrap; 
      text-shadow: 2px 2px 0 #941e00;
      display: none;
      animation: pulse-banner 0.45s infinite alternate;
      z-index: 12;
      box-shadow: 0 0 20px #ff6600;
    }

    @keyframes pulse-banner {
      0% { transform: translateX(-50%) scale(0.95); }
      100% { transform: translateX(-50%) scale(1.08); }
    }

    /* ==========================================================
       모달 & 오버레이 스타일
       ========================================================== */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #start-modal {
      background: rgba(0, 0, 0, 0.5); /* 투명도 50%의 검은 배경 */
      justify-content: center;
      gap: 12px;
      padding: 20px 16px;
    }

    .dialog-overlay {
      background: rgba(10, 15, 28, 0.78);
      justify-content: center;
      padding: 20px;
    }

    .dialog-box {
      width: 90%;
      max-width: 340px;
      background: #fffef7;
      border: 4px solid #4a2810;
      border-radius: 28px;
      padding: 22px 18px;
      text-align: center;
      box-shadow: 0 8px 0 #321908;
    }

    /* ==========================================================
       타이틀 및 점수 안내 카드
       ========================================================== */
    .title-badge-container {
      width: 100%;
      max-width: 325px;
      margin: 0 auto;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.35));
    }

    .title-logo-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .guide-card {
      background: rgba(255, 253, 247, 0.95);
      border: 3px solid #5a371e;
      border-radius: 20px;
      padding: 9px 14px;
      margin: 4px auto 0 auto;
      max-width: 295px;
      box-shadow: 0 4px 0 #44240f;
      text-align: center;
    }

    .guide-card-title {
      font-size: 0.95rem;
      color: #5e3d23;
      margin-bottom: 6px;
    }

    .rice-guide-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 1.05rem;
    }

    .mini-rice-icon {
      width: 28px;
      height: 20px;
      border-radius: 14px 14px 4px 4px;
      border: 2px solid #333;
      display: inline-block;
      box-shadow: 1px 2px 0 rgba(0,0,0,0.15);
      vertical-align: middle;
    }
    .icon-white  { background: #ffffff; border-color: #5c3f26; }
    .icon-pink   { background: #ffb8cc; border-color: #7a2b3d; }
    .icon-purple { background: #ba7ece; border-color: #3b1747; }

    /* ==========================================================
       버튼 UI
       ========================================================== */
    .bottom-action-container {
      width: 100%;
      max-width: 325px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* 핑크 젤리 START 메인 버튼 */
    .btn-start {
      position: relative;
      width: 86%;
      max-width: 290px;
      height: 60px;
      background: linear-gradient(180deg, #ffa8c0 0%, #ff739b 48%, #f24e7d 100%);
      border: 3.5px solid #4a1923;
      border-radius: 9999px;
      box-shadow: 
        inset 0 3px 2px rgba(255, 255, 255, 0.8),
        inset 0 -3px 3px rgba(160, 20, 50, 0.25),
        0 6px 0 #4a1923,
        0 8px 15px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      outline: none;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 10px;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-start:active {
      transform: translateY(4px);
      box-shadow: 
        inset 0 3px 2px rgba(255, 255, 255, 0.8),
        inset 0 -3px 3px rgba(160, 20, 50, 0.25),
        0 2px 0 #4a1923,
        0 4px 8px rgba(0, 0, 0, 0.25);
    }

    .btn-start-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      pointer-events: none;
    }

    /* 랭킹보기 버튼 (중앙 정렬) */
    .btn-pill-sub {
      height: 44px;
      padding: 0 22px;
      border-radius: 9999px;
      background: #ffffff;
      border: 3px solid #5a371e;
      box-shadow: 0 4px 0 #44240f;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 1.05rem;
      color: #4a2810;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      margin: 0 auto;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-pill-sub:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #44240f;
    }

    /* 일러스트 왕관 아이콘 */
    .crown-icon {
      width: 24px;
      height: 20px;
      display: inline-block;
      vertical-align: middle;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.15));
    }

    /* 모달 버튼 */
    .btn-dialog-pink {
      background: linear-gradient(180deg, #ff94b4 0%, #ff6b95 50%, #f04e7b 100%);
      color: white;
      font-size: 1.25rem;
      border: 3px solid #4a1923;
      border-radius: 25px;
      padding: 9px 22px;
      cursor: pointer;
      margin: 8px auto;
      display: block;
      width: 82%;
      box-shadow: 0 4px 0 #4a1923;
      /* 8방향 그림자를 줘서 테두리가 끊기지 않게 수정 */
      text-shadow: 
        -1.5px -1.5px 0 #4a1923,
         1.5px -1.5px 0 #4a1923,
        -1.5px  1.5px 0 #4a1923,
         1.5px  1.5px 0 #4a1923,
         0px   -1.5px 0 #4a1923,
         0px    1.5px 0 #4a1923,
        -1.5px  0px   0 #4a1923,
         1.5px  0px   0 #4a1923;
      transition: 0.08s;
      outline: none;
    }

    .btn-dialog-pink:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #4a1923;
    }

    .btn-dialog-pink:disabled {
      background: #ccc;
      border-color: #999;
      box-shadow: 0 4px 0 #999;
      cursor: not-allowed;
    }

    .btn-dialog-sub {
      background: #ffffff;
      border: 2.8px solid #5a371e;
      color: #4a2810;
      border-radius: 22px;
      padding: 8px 18px;
      font-size: 1.05rem;
      cursor: pointer;
      margin: 6px auto 0 auto;
      display: block;
      width: 82%;
      box-shadow: 0 3px 0 #44240f;
      transition: 0.08s;
      outline: none;
    }

    .btn-dialog-sub:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #44240f;
    }

    .ranking-table {
      width: 100%;
      margin: 12px 0;
      max-height: 220px;
      overflow-y: auto;
    }

    .ranking-table tr {
      border-bottom: 1px dashed #dfc2a6;
      display: flex;
      justify-content: space-between;
      padding: 6px 10px;
      font-size: 1.05rem;
    }

    .rank-num { font-weight: bold; color: #e84b57; }
    .rank-name { color: #5a3825; }
    .rank-pts { font-weight: bold; color: #3c8254; }

    input.name-input {
      width: 82%;
      padding: 8px 12px;
      font-size: 1.1rem;
      border: 2.5px solid #4a2810;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 8px;
      outline: none;
      background: #fff;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="top-ui" style="display: none;">
    <div class="ui-pill" id="timer-box">
      <span class="ui-label-group">
        <img class="ui-icon" alt="TIME" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M7 6C5 8 5 11 7 12' stroke='%235d3a1a' stroke-width='2.6' stroke-linecap='round' fill='none'/><path d='M25 6C27 8 27 11 25 12' stroke='%235d3a1a' stroke-width='2.6' stroke-linecap='round' fill='none'/><path d='M8 26L5 29' stroke='%235d3a1a' stroke-width='2.6' stroke-linecap='round'/><path d='M24 26L27 29' stroke='%235d3a1a' stroke-width='2.6' stroke-linecap='round'/><circle cx='16' cy='17' r='11.5' fill='%23ffe49e' stroke='%235d3a1a' stroke-width='2.6'/><circle cx='16' cy='17' r='8.5' fill='%23ffffff'/><path d='M16 17L16 12' stroke='%235d3a1a' stroke-width='2.2' stroke-linecap='round'/><path d='M16 17L20.5 17' stroke='%23e65c5c' stroke-width='2.2' stroke-linecap='round'/><circle cx='16' cy='17' r='1.8' fill='%235d3a1a'/></svg>">
        TIME
      </span>
      <span id="time-text">60</span>
    </div>

    <div class="ui-pill">
      <span class="ui-label-group">
        <img class="ui-icon" alt="SCORE" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M5 27L27 5' stroke='%23b88147' stroke-width='3.2' stroke-linecap='round'/><circle cx='10' cy='22' r='5.2' fill='%23b5db97' stroke='%235d3a1a' stroke-width='2.2'/><circle cx='16' cy='16' r='5.2' fill='%23ffffff' stroke='%235d3a1a' stroke-width='2.2'/><circle cx='22' cy='10' r='5.2' fill='%23ff9cb5' stroke='%235d3a1a' stroke-width='2.2'/><circle cx='8.5' cy='20.5' r='1.3' fill='%23ffffff'/><circle cx='14.5' cy='14.5' r='1.3' fill='%23ffffff'/><circle cx='20.5' cy='8.5' r='1.3' fill='%23ffffff'/></svg>">
        SCORE
      </span>
      <span id="score-text">0</span>
    </div>
  </div>

  <div id="fever-banner">🔥 FEVER TIME! 🔥</div>

  <!-- 시작 화면 -->
  <div class="modal-overlay" id="start-modal">
    <!-- 타이틀 및 엠블럼 -->
    <div class="title-badge-container">
      <svg class="title-logo-svg" viewBox="0 0 340 180" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="yellowGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fffb99"/>
            <stop offset="60%" stop-color="#ffd534"/>
            <stop offset="100%" stop-color="#f2a800"/>
          </linearGradient>
          <linearGradient id="pinkGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffb8cc"/>
            <stop offset="55%" stop-color="#ff7ca1"/>
            <stop offset="100%" stop-color="#e84573"/>
          </linearGradient>
          <filter id="cloudShadow" x="-10%" y="-10%" width="125%" height="125%">
            <feDropShadow dx="0" dy="5" stdDeviation="0" flood-color="#2d150b"/>
          </filter>
        </defs>

        <!-- 구름 배경 및 귀 -->
        <g filter="url(#cloudShadow)">
          <path d="M 230 46 C 220 16, 235 2, 245 10 C 255 18, 250 45, 246 52 Z" fill="#fffef5" stroke="#3e1e10" stroke-width="4.5" stroke-linejoin="round"/>
          <path d="M 232 38 C 226 20, 236 10, 242 16 C 248 22, 244 38, 242 42 Z" fill="#ffb8cc"/>
          
          <path d="M 252 50 C 250 20, 268 10, 275 20 C 282 30, 272 50, 266 58 Z" fill="#fffef5" stroke="#3e1e10" stroke-width="4.5" stroke-linejoin="round"/>
          <path d="M 256 42 C 255 26, 267 18, 271 25 C 275 32, 268 44, 264 47 Z" fill="#ffb8cc"/>

          <path d="
            M 60 90
            C 40 85, 25 100, 28 120
            C 22 135, 38 155, 65 152
            C 80 162, 120 165, 170 162
            C 220 165, 260 162, 280 152
            C 308 155, 322 132, 315 118
            C 322 98, 305 82, 285 86
            C 285 62, 260 48, 235 55
            C 215 35, 175 32, 150 45
            C 130 35, 95 38, 80 60
            C 60 58, 48 72, 60 90 Z
          " fill="#fffdf5" stroke="#3e1e10" stroke-width="5" stroke-linejoin="round" />
        </g>

        <!-- 벚꽃 & 이파리 장식 -->
        <g transform="translate(42, 74) scale(0.9)">
          <circle cx="-5" cy="0" r="5" fill="#ffb3cb"/>
          <circle cx="5" cy="0" r="5" fill="#ffb3cb"/>
          <circle cx="0" cy="-5" r="5" fill="#ffb3cb"/>
          <circle cx="0" cy="5" r="5" fill="#ffb3cb"/>
          <circle cx="0" cy="0" r="3.5" fill="#ffe066"/>
        </g>
        <g transform="translate(290, 78) scale(0.9)">
          <circle cx="-5" cy="0" r="5" fill="#ffb3cb"/>
          <circle cx="5" cy="0" r="5" fill="#ffb3cb"/>
          <circle cx="0" cy="-5" r="5" fill="#ffb3cb"/>
          <circle cx="0" cy="5" r="5" fill="#ffb3cb"/>
          <circle cx="0" cy="0" r="3.5" fill="#ffe066"/>
        </g>
        <path d="M 265 60 C 275 52, 285 62, 275 70 C 265 68, 260 62, 265 60 Z" fill="#8ec354" stroke="#3e1e10" stroke-width="2"/>

        <!-- 1행 타이틀: 달토끼 -->
        <text x="170" y="94" text-anchor="middle" font-family="'Jua', sans-serif" font-size="46" font-weight="900"
              fill="url(#yellowGrad)" stroke="#3e1e10" stroke-width="7.5" stroke-linejoin="round" paint-order="stroke fill" letter-spacing="2">달토끼</text>

        <!-- 좌측 흰 송편 -->
        <g transform="translate(48, 127) scale(0.7) rotate(-15)">
          <path d="M -16 5 Q 0 -18 16 5 Q 0 16 -16 5 Z" fill="#ffffff" stroke="#3e1e10" stroke-width="3.5" stroke-linejoin="round"/>
          <ellipse cx="-4" cy="-1" rx="6" ry="3" fill="rgba(255,255,255,0.9)" transform="rotate(-15)"/>
        </g>

        <!-- 2행 타이틀: 송편잡기 -->
        <text x="170" y="142" text-anchor="middle" font-family="'Jua', sans-serif" font-size="40" font-weight="900"
              fill="url(#pinkGrad)" stroke="#3e1e10" stroke-width="7.5" stroke-linejoin="round" paint-order="stroke fill" letter-spacing="1">송편잡기</text>

        <!-- 우측 보라 송편 -->
        <g transform="translate(290, 127) scale(0.7) rotate(15)">
          <path d="M -16 5 Q 0 -18 16 5 Q 0 16 -16 5 Z" fill="#ba7ece" stroke="#3e1e10" stroke-width="3.5" stroke-linejoin="round"/>
          <ellipse cx="-4" cy="-1" rx="6" ry="3" fill="rgba(255,255,255,0.8)" transform="rotate(-15)"/>
        </g>
      </svg>

      <!-- 점수 안내 박스 -->
      <div class="guide-card">
        <div class="guide-card-title">토끼에게 맛있는 송편을 먹여 주세요!</div>
        <div class="rice-guide-row">
          <span class="mini-rice-icon icon-white"></span>
          <span style="color:#c9325e; font-weight:bold;">+10점</span>
          <span class="mini-rice-icon icon-pink" style="margin-left: 8px;"></span>
          <span style="color:#ff688c; font-weight:bold;">+20점</span>
        </div>
        <div class="rice-guide-row" style="margin-top: 4px;">
          <span class="mini-rice-icon icon-purple"></span>
          <span style="color:#6d3596; font-weight:bold;">콩송편: -10점</span>
        </div>
      </div>
    </div>

    <!-- 하단 버튼 영역 -->
    <div class="bottom-action-container">
      <button class="btn-start" id="start-btn">
        <svg class="btn-start-svg" viewBox="0 0 240 50" xmlns="http://www.w3.org/2000/svg">
          <!-- 좌측 벚꽃 -->
          <g transform="translate(34, 24)">
            <circle cx="0" cy="-5.5" r="4.8" fill="#fff2f6" stroke="#4a1923" stroke-width="2.4"/>
            <circle cx="5.2" cy="-1.7" r="4.8" fill="#fff2f6" stroke="#4a1923" stroke-width="2.4"/>
            <circle cx="3.2" cy="4.5" r="4.8" fill="#fff2f6" stroke="#4a1923" stroke-width="2.4"/>
            <circle cx="-3.2" cy="4.5" r="4.8" fill="#fff2f6" stroke="#4a1923" stroke-width="2.4"/>
            <circle cx="-5.2" cy="-1.7" r="4.8" fill="#fff2f6" stroke="#4a1923" stroke-width="2.4"/>
            <circle cx="0" cy="0" r="3.2" fill="#ff99b3"/>
          </g>

          <!-- START 텍스트 -->
          <text x="120" y="34.5" text-anchor="middle" font-family="'Jua', sans-serif" font-size="31" font-weight="900"
                fill="#ffffff" stroke="#8a2a43" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"
                paint-order="stroke fill" letter-spacing="2.5">START</text>

          <!-- 우측 벚꽃 -->
          <g transform="translate(206, 24)">
            <circle cx="0" cy="-5.5" r="4.8" fill="#fff2f6" stroke="#4a1923" stroke-width="2.4"/>
            <circle cx="5.2" cy="-1.7" r="4.8" fill="#fff2f6" stroke="#4a1923" stroke-width="2.4"/>
            <circle cx="3.2" cy="4.5" r="4.8" fill="#fff2f6" stroke="#4a1923" stroke-width="2.4"/>
            <circle cx="-3.2" cy="4.5" r="4.8" fill="#fff2f6" stroke="#4a1923" stroke-width="2.4"/>
            <circle cx="-5.2" cy="-1.7" r="4.8" fill="#fff2f6" stroke="#4a1923" stroke-width="2.4"/>
            <circle cx="0" cy="0" r="3.2" fill="#ff99b3"/>
          </g>
        </svg>
      </button>

      <!-- 랭킹보기 버튼 -->
      <button class="btn-pill-sub" id="open-rank-btn">
        <svg class="crown-icon" viewBox="0 0 28 24" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="crownGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff885"/>
              <stop offset="45%" stop-color="#ffd534"/>
              <stop offset="100%" stop-color="#f59e0b"/>
            </linearGradient>
          </defs>
          <path d="M 5 19.5 L 3 9.5 L 9 13.8 L 14 6 L 19 13.8 L 25 9.5 L 23 19.5 Z"
                fill="url(#crownGrad)"
                stroke="#4a2810"
                stroke-width="2.5"
                stroke-linejoin="round"
                stroke-linecap="round"/>
          <path d="M 5.8 17 L 22.2 17" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
          <circle cx="3" cy="9.2" r="1.6" fill="#fff885" stroke="#4a2810" stroke-width="1.6"/>
          <circle cx="14" cy="5.8" r="2" fill="#fff885" stroke="#4a2810" stroke-width="1.6"/>
          <circle cx="25" cy="9.2" r="1.6" fill="#fff885" stroke="#4a2810" stroke-width="1.6"/>
          <circle cx="14" cy="11.8" r="1.5" fill="#ffffff" opacity="0.9"/>
        </svg>
        <span>랭킹보기</span>
      </button>

/* ==========================================================
   1. 정밀 Web Audio API 칩튠 BGM 및 SFX 엔진
   ========================================================== */
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let masterGain = null;

let isBgmPlaying = false;
let bgmStep = 0;
let nextStepTime = 0.0;
let bgmTimerID = null;
let noiseBuffer = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new AudioContext();
    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    masterGain.connect(audioCtx.destination);
    createNoiseBuffer();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function createNoiseBuffer() {
  const bufferSize = audioCtx.sampleRate * 1.5;
  noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const output = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    output[i] = Math.random() * 2 - 1;
  }
}

const N = {
  C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
  C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, B5: 987.77,
  C6: 1046.50, D6: 1174.66, E6: 1318.51, _: 0
};

const bgmMelody = [
  N.E5, N.G5, N.C6, N.G5,  N.E5, N.D5, N.C5, N.D5,
  N.E5, N.A5, N.C6, N.A5,  N.E5, N.D5, N.C5, N.E5,
  N.F5, N.A5, N.C6, N.A5,  N.F5, N.G5, N.A5, N.C6,
  N.B5, N.G5, N.D6, N.B5,  N.G5, N.A5, N.B5, N.D6
];

const bgmBass = [
  N.C3, N.C4, N.G3, N.C4,  N.E3, N.C4, N.G3, N.C4,
  N.A3, N.A3, N.E3, N.A3,  N.C3, N.A3, N.E3, N.A3,
  N.F3, N.F3, N.C3, N.F3,  N.A3, N.F3, N.C3, N.F3,
  N.G3, N.G3, N.D3, N.G3,  N.B3, N.G3, N.D3, N.G3
];

function playSynthTone(freq, time, duration, type = 'square', gainLevel = 0.08) {
  if (!freq || freq === 0 || !masterGain) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, time);

  gain.gain.setValueAtTime(gainLevel, time);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(time);
  osc.stop(time + duration);
}

function playDrum(type, time) {
  if (!masterGain) return;
  if (type === 'kick') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(130, time);
    osc.frequency.exponentialRampToValueAtTime(32, time + 0.09);
    gain.gain.setValueAtTime(0.18, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.09);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(time);
    osc.stop(time + 0.09);
  } else if (type === 'snare' && noiseBuffer) {
    const node = audioCtx.createBufferSource();
    node.buffer = noiseBuffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.setValueAtTime(900, time);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.09, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.07);

    node.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    node.start(time);
    node.stop(time + 0.07);
  } else if (type === 'hihat' && noiseBuffer) {
    const node = audioCtx.createBufferSource();
    node.buffer = noiseBuffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.setValueAtTime(4500, time);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.04, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.025);

    node.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    node.start(time);
    node.stop(time + 0.025);
  }
}

function scheduleBGM() {
  if (!isBgmPlaying) return;

  const tempo = fever ? 172 : 138; 
  const stepInterval = (60.0 / tempo) / 2;

  while (nextStepTime < audioCtx.currentTime + 0.15) {
    const step = bgmStep % 32;

    const melFreq = bgmMelody[step];
    playSynthTone(melFreq, nextStepTime, stepInterval * 0.85, 'square', fever ? 0.07 : 0.06);

    const bassFreq = bgmBass[step];
    playSynthTone(bassFreq, nextStepTime, stepInterval * 0.9, 'triangle', 0.12);

    if (step % 8 === 0 || step % 8 === 4) {
      playDrum('kick', nextStepTime);
    } else if (step % 8 === 2 || step % 8 === 6) {
      playDrum('snare', nextStepTime);
    }
    playDrum('hihat', nextStepTime);

    nextStepTime += stepInterval;
    bgmStep++;
  }

  bgmTimerID = setTimeout(scheduleBGM, 35);
}

function startBGM() {
  initAudio();
  if (bgmTimerID) clearTimeout(bgmTimerID);
  isBgmPlaying = true;
  bgmStep = 0;
  nextStepTime = audioCtx.currentTime + 0.05;
  scheduleBGM();
}

function stopBGM() {
  isBgmPlaying = false;
  if (bgmTimerID) clearTimeout(bgmTimerID);
}

function playSound(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  if (type === 'good') {
    playSynthTone(880, now, 0.08, 'sine', 0.15);
    playSynthTone(1320, now + 0.07, 0.12, 'sine', 0.18);
  } else if (type === 'bad') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(260, now);
    osc.frequency.linearRampToValueAtTime(110, now + 0.18);

    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.18);
  } else if (type === 'gameover') {
    [523.25, 493.88, 440.00, 349.23].forEach((f, i) => {
      playSynthTone(f, now + i * 0.12, 0.14, 'square', 0.09);
    });
  }
}

function drawNightSky(t) {
  const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
  skyGrad.addColorStop(0, '#152238');
  skyGrad.addColorStop(0.5, '#283b58');
  skyGrad.addColorStop(0.85, '#6c7f99');
  skyGrad.addColorStop(0.85, '#4f692b'); 
  skyGrad.addColorStop(1, '#34451c');
  
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, width, height);

  stars.forEach((s) => {
    const alpha = 0.35 + Math.abs(Math.sin(t * s.twinkleSpeed + s.twinkleOffset)) * 0.65;
    ctx.save();
    ctx.fillStyle = `rgba(255, 255, 210, ${alpha})`;
    ctx.shadowColor = '#fff69b';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(s.x - s.size * 2, s.y - 0.7, s.size * 4, 1.4);
    ctx.fillRect(s.x - 0.7, s.y - s.size * 2, 1.4, s.size * 4);
    ctx.restore();
  });

  ctx.save();
  const moonX = width - 95;
  const moonY = 110;
  const moonRadius = 48;
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonRadius + 14, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 244, 160, 0.15)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
  ctx.fillStyle = '#fff4a1';
  ctx.shadowColor = '#ffe259';
  ctx.shadowBlur = 18;
  ctx.fill();
  
  ctx.fillStyle = '#e8d984';
  ctx.beginPath();
  ctx.arc(moonX - 14, moonY - 10, 11, 0, Math.PI * 2);
  ctx.arc(moonX + 16, moonY - 14, 13, 0, Math.PI * 2);
  ctx.arc(moonX + 6, moonY + 16, 15, 0, Math.PI * 2);
  ctx.arc(moonX - 18, moonY + 14, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  clouds.forEach(c => {
    c.x += c.speed;
    if (c.x > width + 100) c.x = -120;
    drawCloud(c.x, c.y, c.scale);
  });

  const groundY = height - 68;

  ctx.save();
  const grad1 = ctx.createLinearGradient(0, groundY - 240, 0, groundY - 100);
  grad1.addColorStop(0, 'rgba(58, 84, 117, 0.9)'); 
  grad1.addColorStop(1, 'rgba(82, 110, 145, 0.2)'); 
  ctx.fillStyle = grad1;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(0, groundY - 130);
  ctx.bezierCurveTo(width * 0.2, groundY - 120, width * 0.35, groundY - 240, width * 0.55, groundY - 180);
  ctx.bezierCurveTo(width * 0.75, groundY - 120, width * 0.85, groundY - 190, width, groundY - 150);
  ctx.lineTo(width, groundY);
  ctx.fill();

  const grad2 = ctx.createLinearGradient(0, groundY - 220, 0, groundY - 80);
  grad2.addColorStop(0, 'rgba(45, 69, 99, 0.95)');
  grad2.addColorStop(1, 'rgba(55, 83, 117, 0.3)');
  ctx.fillStyle = grad2;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(0, groundY - 180);
  ctx.bezierCurveTo(width * 0.3, groundY - 220, width * 0.5, groundY - 80, width * 0.75, groundY - 130);
  ctx.bezierCurveTo(width * 0.9, groundY - 160, width, groundY - 140, width, groundY - 110);
  ctx.lineTo(width, groundY);
  ctx.fill();

  const grad3 = ctx.createLinearGradient(0, groundY - 180, 0, groundY - 50);
  grad3.addColorStop(0, 'rgba(31, 52, 80, 1)');
  grad3.addColorStop(1, 'rgba(38, 62, 92, 0.5)');
  ctx.fillStyle = grad3;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(0, groundY - 80);
  ctx.bezierCurveTo(width * 0.2, groundY - 60, width * 0.4, groundY - 180, width * 0.75, groundY - 60);
  ctx.bezierCurveTo(width * 0.85, groundY - 20, width, groundY - 60, width, groundY - 80);
  ctx.lineTo(width, groundY);
  ctx.fill();

  ctx.restore();

  drawDetailedPineBranch(-20, 190, 1.18);

  ctx.fillStyle = '#425c27';
  ctx.fillRect(0, groundY, width, 68);
  ctx.fillStyle = '#2d4219';
  ctx.fillRect(0, groundY, width, 6);

  fieldFlowers.forEach(f => {
    drawFlower(width * f.x, groundY + f.yOffset, f.color, f.scale);
  });

  if (feverTransition > 0) {
    ctx.save();
    const overlayGrad = ctx.createLinearGradient(0, 0, 0, height);
    overlayGrad.addColorStop(0, `rgba(200, 20, 50, ${0.45 * feverTransition})`);
    overlayGrad.addColorStop(0.5, `rgba(220, 50, 80, ${0.35 * feverTransition})`);
    overlayGrad.addColorStop(1, `rgba(255, 100, 120, ${0.45 * feverTransition})`);
    
    ctx.fillStyle = overlayGrad;
    ctx.fillRect(0, 0, width, height);
    ctx.restore();
  }
}

function drawDetailedPineBranch(tx, ty, scale) {
  ctx.save();
  ctx.translate(tx, ty);
  ctx.scale(scale, scale);
  
  ctx.strokeStyle = '#3d2314';
  ctx.lineWidth = 18;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-10, -5);
  ctx.quadraticCurveTo(60, 25, 150, 75);
  ctx.stroke();

  ctx.strokeStyle = '#5c3a21';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(-5, -2);
  ctx.quadraticCurveTo(55, 23, 140, 70);
  ctx.stroke();

  ctx.strokeStyle = '#3d2314';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(50, 35);
  ctx.quadraticCurveTo(90, 70, 110, 110);
  ctx.stroke();

  drawPineNeedles(25, 10, 42);
  drawPineNeedles(80, 45, 38);
  drawPineNeedles(135, 75, 32);
  drawPineNeedles(95, 100, 28);
  drawPineNeedles(45, 60, 34);
  
  ctx.restore();
}

function drawPineNeedles(x, y, radius) {
  ctx.fillStyle = '#1e3822'; 
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.arc(x - radius*0.6, y + radius*0.5, radius*0.8, 0, Math.PI * 2);
  ctx.arc(x + radius*0.6, y + radius*0.5, radius*0.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#2a5231';
  ctx.beginPath();
  ctx.arc(x, y - radius*0.2, radius*0.75, 0, Math.PI*2);
  ctx.fill();
}

function drawCloud(cx, cy, s) {
  ctx.save();
  ctx.fillStyle = 'rgba(230, 242, 255, 0.28)';
  ctx.beginPath();
  ctx.arc(cx, cy, 22 * s, 0, Math.PI * 2);
  ctx.arc(cx + 25 * s, cy - 10 * s, 26 * s, 0, Math.PI * 2);
  ctx.arc(cx + 55 * s, cy - 4 * s, 20 * s, 0, Math.PI * 2);
  ctx.arc(cx + 35 * s, cy + 12 * s, 24 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawFlower(fx, fy, color, scale = 1) {
  ctx.save();
  ctx.translate(fx, fy);
  ctx.scale(scale, scale);
  
  ctx.fillStyle = '#3a611c';
  ctx.fillRect(-1.5, 0, 3, 14);
  
  ctx.fillStyle = color;
  for (let i = 0; i < 5; i++) {
    const ang = (i * Math.PI * 2) / 5;
    ctx.beginPath();
    ctx.arc(Math.cos(ang) * 5, Math.sin(ang) * 5, 4.5, 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.fillStyle = '#ffdf40';
  ctx.beginPath();
  ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();
}

function drawSongpyeon(r) {
  ctx.save();
  ctx.translate(r.x, r.y);
  ctx.rotate(r.angle);
  
  ctx.beginPath();
  ctx.arc(0, 2, r.size, Math.PI, 2 * Math.PI, false);
  ctx.quadraticCurveTo(0, r.size * 0.5 + 2, -r.size, 2);
  ctx.closePath();

  const grad = ctx.createRadialGradient(-r.size * 0.3, -r.size * 0.3, r.size * 0.1, 0, 0, r.size);
  if (r.type === 'white') {
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.5, '#fdfdfd');
    grad.addColorStop(1, '#e0e0e0');
    ctx.strokeStyle = '#4e331b';
  } else if (r.type === 'pink') {
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.4, '#ffb3c7');
    grad.addColorStop(1, '#d97d95');
    ctx.strokeStyle = '#6e2738';
  } else {
    grad.addColorStop(0, '#f2d9ff');
    grad.addColorStop(0.4, '#a26bb9');
    grad.addColorStop(1, '#7a4291');
    ctx.strokeStyle = '#3d164a';
  }
  
  ctx.fillStyle = grad;
  ctx.lineWidth = 3;
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(-r.size * 0.35, -r.size * 0.3, r.size * 0.3, r.size * 0.15, -0.2, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(r.size * 0.4, r.size * 0.1, r.size * 0.1, r.size * 0.05, -0.4, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.fill();

  ctx.restore();
}

/* ==========================================================
   5. 토끼 캐릭터 렌더링
   ========================================================== */
function drawPlayer(x, y) {
  ctx.save();
  ctx.translate(x, y);

  if (feverTransition > 0) {
    const t = Date.now() / 150;
    ctx.save();
    ctx.globalAlpha = feverTransition; 
    
    const drawFlame = (color, w, h, offset) => {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, 45); 
      ctx.bezierCurveTo(-w*1.2, 45, -w*1.5, -10, -w*0.8, -30 + Math.sin(t + offset) * 10);
      ctx.bezierCurveTo(-w*0.5, -15, -w*0.4, -25, -w*0.3, -h*0.75 + Math.cos(t * 1.3) * 10);
      ctx.bezierCurveTo(-w*0.1, -h*0.4, -w*0.05, -h*0.5, 0, -h + Math.sin(t * 1.5) * 12);
      ctx.bezierCurveTo(w*0.05, -h*0.5, w*0.1, -h*0.4, w*0.3, -h*0.75 + Math.cos(t * 1.1) * 10);
      ctx.bezierCurveTo(w*0.4, -25, w*0.5, -15, w*0.8, -30 + Math.sin(t * 1.4) * 10);
      ctx.bezierCurveTo(w*1.5, -10, w*1.2, 45, 0, 45);
      ctx.fill();
    };

    ctx.shadowColor = '#ff2600';
    ctx.shadowBlur = 10;
    drawFlame('#ff4d00', 65, 85, 0); 
    ctx.shadowBlur = 0;
    drawFlame('#ffae00', 50, 65, 0.5); 
    drawFlame('#fff066', 35, 45, 1); 

    ctx.restore();
  }

  const lineW = 3.5; 
  ctx.save();
  ctx.scale(0.85, 0.85);
  
  const drawEars = (isStroke) => {
    ctx.beginPath();
    ctx.ellipse(-20, -32, 16, 24, -0.2, 0, Math.PI*2);
    if(isStroke) ctx.stroke(); else ctx.fill();
    
    ctx.beginPath();
    ctx.ellipse(20, -32, 16, 24, 0.2, 0, Math.PI*2);
    if(isStroke) ctx.stroke(); else ctx.fill();
  };

  const drawBody = (isStroke) => {
    ctx.beginPath();
    ctx.moveTo(-15, -15);
    ctx.bezierCurveTo(-55, -15, -60, 25, -35, 42); 
    ctx.bezierCurveTo(-15, 52, 15, 52, 35, 42);   
    ctx.bezierCurveTo(60, 25, 55, -15, 15, -15);   
    ctx.bezierCurveTo(5, -20, -5, -20, -15, -15);  
    ctx.closePath();
    if(isStroke) ctx.stroke(); else ctx.fill();
  };

  const drawArms = (isStroke) => {
    ctx.beginPath();
    ctx.ellipse(-32, 18, 11, 8, 0.4, 0, Math.PI*2);
    if(isStroke) ctx.stroke(); else ctx.fill();

    ctx.beginPath();
    ctx.ellipse(32, 18, 11, 8, -0.4, 0, Math.PI*2);
    if(isStroke) ctx.stroke(); else ctx.fill();
  };

  const drawLegs = (isStroke) => {
    ctx.beginPath();
    ctx.ellipse(-16, 42, 11, 8, 0, 0, Math.PI*2);
    if(isStroke) ctx.stroke(); else ctx.fill();

    ctx.beginPath();
    ctx.ellipse(16, 42, 11, 8, 0, 0, Math.PI*2);
    if(isStroke) ctx.stroke(); else ctx.fill();
  };

  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = lineW * 2;
  ctx.strokeStyle = '#2c1910'; 
  
  drawEars(true);
  drawLegs(true);
  drawArms(true);
  drawBody(true);

  ctx.fillStyle = '#ffffff';
  
  drawEars(false);
  drawLegs(false);
  drawArms(false);
  drawBody(false);

  ctx.fillStyle = '#fff2cc'; 
  ctx.beginPath();
  ctx.ellipse(-20, -32, 7, 12, -0.2, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(20, -32, 7, 12, 0.2, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#ffb3c6';
  ctx.beginPath();
  ctx.ellipse(-26, 6, 9, 6, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(26, 6, 9, 6, 0, 0, Math.PI*2);
  ctx.fill();

  if (rabbit.eatTimer > 0) {
    if (rabbit.eatType === 'bad') {
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#2c1910';
      ctx.beginPath();
      ctx.moveTo(-16, -2); ctx.lineTo(-11, 2); ctx.lineTo(-16, 6);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(16, -2); ctx.lineTo(11, 2); ctx.lineTo(16, 6);
      ctx.stroke();

      ctx.fillStyle = '#74c0fc';
      ctx.beginPath();
      ctx.ellipse(-11, 9, 3, 4, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(11, 9, 3, 4, 0, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = '#2c1910';
      ctx.beginPath();
      ctx.ellipse(0, 8, 4, 5, 0, 0, Math.PI*2);
      ctx.fill();
    } else if (rabbit.eatType === 'good') {
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#2c1910';
      ctx.beginPath();
      ctx.moveTo(-16, 1); ctx.quadraticCurveTo(-12, -4, -8, 1);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(8, 1); ctx.quadraticCurveTo(12, -4, 16, 1);
      ctx.stroke();

      ctx.fillStyle = '#2c1910';
      ctx.beginPath();
      ctx.arc(0, 4, 6, 0, Math.PI, false);
      ctx.fill();
      ctx.fillStyle = '#ff87a3';
      ctx.beginPath();
      ctx.arc(0, 6, 4, 0, Math.PI, false);
      ctx.fill();
    }
  } else {
    ctx.fillStyle = '#2c1910';
    ctx.beginPath();
    ctx.arc(-12, -1, 4, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(12, -1, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.lineWidth = 3;
    ctx.strokeStyle = '#2c1910';
    ctx.beginPath();
    ctx.moveTo(-5, 4);
    ctx.quadraticCurveTo(-2.5, 9, 0, 5);
    ctx.quadraticCurveTo(2.5, 9, 5, 4);
    ctx.stroke();
  }

  ctx.restore();
  ctx.restore();
}

/* ==========================================================
   6. 게임 메인 루프
   ========================================================== */
let lastSpawn = 0;

function gameLoop(timestamp) {
  drawNightSky(timestamp * 0.001);

  if (gameState === 'PLAYING') {
    if (fever) {
      feverTransition = Math.min(1, feverTransition + 0.015);
      if (Math.random() < 0.35) spawnRedStar();
    } else {
      feverTransition = Math.max(0, feverTransition - 0.05);
    }

    if (rabbit.eatTimer > 0) rabbit.eatTimer--;

    let dx = rabbit.targetX - rabbit.x;
    rabbit.x += dx * rabbit.speed;
    rabbit.x = Math.max(50, Math.min(width - 50, rabbit.x));

    const spawnDelay = fever ? 260 : 520;
    if (timestamp - lastSpawn > spawnDelay) {
      spawnRice();
      lastSpawn = timestamp;
    }

    for (let i = redStars.length - 1; i >= 0; i--) {
      const s = redStars[i];
      s.y += s.speedY;
      s.x += Math.sin(timestamp * 0.003 + s.offset) * 1.5;

      ctx.save();
      ctx.globalAlpha = 0.4 + Math.abs(Math.sin(timestamp * 0.005 + s.offset)) * 0.6;
      ctx.fillStyle = s.color;
      ctx.shadowColor = s.color;
      ctx.shadowBlur = 12;
      
      ctx.beginPath();
      ctx.moveTo(s.x, s.y - s.size);
      ctx.quadraticCurveTo(s.x, s.y, s.x + s.size, s.y);
      ctx.quadraticCurveTo(s.x, s.y, s.x, s.y + s.size);
      ctx.quadraticCurveTo(s.x, s.y, s.x - s.size, s.y);
      ctx.quadraticCurveTo(s.x, s.y, s.x, s.y - s.size);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * 0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (s.y > height + 20) redStars.splice(i, 1);
    }

    for (let i = rices.length - 1; i >= 0; i--) {
      const r = rices[i];
      r.y += r.speed;
      drawSongpyeon(r);

      const dist = Math.hypot(rabbit.x - r.x, rabbit.y - r.y);
      if (dist < 55) {
        if (r.type === 'purple') {
          score = Math.max(0, score - 10);
          playSound('bad');
          addEatParticle(rabbit.x, rabbit.y - 40, '-10', '#a26bb9');
          rabbit.eatTimer = 25;
          rabbit.eatType = 'bad';
        } else if (r.type === 'pink') {
          score += 20;
          playSound('good');
          addEatParticle(rabbit.x, rabbit.y - 40, '+20', '#ffb3c7');
          rabbit.eatTimer = 25;
          rabbit.eatType = 'good';
        } else {
          score += 10;
          playSound('good');
          addEatParticle(rabbit.x, rabbit.y - 40, '+10', '#ffffff');
          rabbit.eatTimer = 25;
          rabbit.eatType = 'good';
        }
        document.getElementById('score-text').innerText = score;
        rices.splice(i, 1);
        continue;
      }

      if (r.y > height + 40) rices.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.y += p.vy;
      p.alpha -= 0.024;
      ctx.save();
      ctx.font = 'bold 26px Jua';
      ctx.globalAlpha = Math.max(0, p.alpha);
      
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#2c1910';
      ctx.strokeText(p.text, p.x - 20, p.y);
      
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x - 20, p.y);
      ctx.restore();
      if (p.alpha <= 0) particles.splice(i, 1);
    }
    
    drawPlayer(rabbit.x, rabbit.y);
  } else {
    drawPlayer(rabbit.x, rabbit.y);
  }

  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

/* ==========================================================
   7. 게임 제어 및 Firebase 랭킹 연동
   ========================================================== */
function startGame() {
  initAudio();
  startBGM();
  
  gameState = 'PLAYING';
  score = 0;
  timeLeft = 60;
  fever = false;
  feverTransition = 0;
  rices.length = 0;
  particles.length = 0;
  redStars.length = 0; 
  rabbit.x = width / 2;
  rabbit.targetX = width / 2;
  rabbit.eatTimer = 0;
  rabbit.eatType = 'none';

  document.getElementById('score-text').innerText = '0';
  document.getElementById('time-text').innerText = '60';
  document.getElementById('top-ui').style.display = 'flex';
  document.getElementById('start-modal').style.display = 'none';
  document.getElementById('gameover-modal').style.display = 'none';
  document.getElementById('fever-banner').style.display = 'none';
  document.getElementById('timer-box').classList.remove('fever-timer');

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById('time-text').innerText = timeLeft;

    if (timeLeft <= 10 && timeLeft > 0) {
      fever = true;
      document.getElementById('fever-banner').style.display = 'block';
      document.getElementById('timer-box').classList.add('fever-timer');
    }

    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  clearInterval(timerInterval);
  stopBGM();
  playSound('gameover');

  gameState = 'GAMEOVER';
  fever = false;
  document.getElementById('fever-banner').style.display = 'none';
  document.getElementById('final-score').innerText = score;
  document.getElementById('gameover-modal').style.display = 'flex';
}

function goToMain() {
  stopBGM();
  gameState = 'START';
  fever = false;
  feverTransition = 0;
  score = 0;
  rices.length = 0;
  particles.length = 0;
  redStars.length = 0; 
  rabbit.x = width / 2;
  rabbit.targetX = width / 2;
  rabbit.eatTimer = 0;
  rabbit.eatType = 'none';

  document.getElementById('gameover-modal').style.display = 'none';
  document.getElementById('top-ui').style.display = 'none';
  document.getElementById('fever-banner').style.display = 'none';
  document.getElementById('start-modal').style.display = 'flex';
}

async function saveRanking(name, score) {
  try {
    const rankRef = db.ref('rankings').push();
    await rankRef.set({
      name: name || '달토끼',
      score: score,
      timestamp: firebase.database.ServerValue.TIMESTAMP
    });
  } catch (error) {
    console.error("Error adding document: ", error);
    alert('기록 저장 중 오류가 발생했습니다.');
  }
}

async function renderRankingTable() {
  const listEl = document.getElementById('ranking-list');
  listEl.innerHTML = '<div style="padding:15px; text-align:center; color:#888;">데이터를 불러오는 중...</div>';
  
  try {
    const snapshot = await db.ref('rankings')
      .orderByChild('score')
      .limitToLast(10)
      .once('value');
      
    listEl.innerHTML = '';
    
    if (!snapshot.exists()) {
      listEl.innerHTML = '<div style="padding:15px; text-align:center; color:#888;">아직 등록된 기록이 없습니다!</div>';
      return;
    }
    
    const ranks = [];
    snapshot.forEach(childSnapshot => {
      ranks.push(childSnapshot.val());
    });
    
    ranks.sort((a, b) => b.score - a.score);
    
    ranks.forEach((r, idx) => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <span class="rank-num">${idx + 1}위</span>
        <span class="rank-name">${r.name}</span>
        <span class="rank-pts">${r.score}점</span>
      `;
      listEl.appendChild(row);
    });
  } catch (error) {
    console.error("Error fetching rankings: ", error);
    listEl.innerHTML = '<div style="padding:15px; text-align:color:#f05255;">랭킹을 불러오지 못했습니다.</div>';
  }
}

/* ==========================================================
   버튼 이벤트 리스너
   ========================================================== */
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

document.getElementById('rank-main-btn').addEventListener('click', () => {
  document.getElementById('ranking-modal').style.display = 'none';
  goToMain();
});

document.getElementById('open-rank-btn').addEventListener('click', () => {
  renderRankingTable();
  document.getElementById('ranking-modal').style.display = 'flex';
});

document.getElementById('save-score-btn').addEventListener('click', async () => {
  const nameInput = document.getElementById('player-name');
  const name = nameInput.value.trim();
  const btn = document.getElementById('save-score-btn');
  
  btn.disabled = true;
  btn.innerText = '등록 중...';
  
  await saveRanking(name, score);
  
  btn.disabled = false;
  btn.innerText = '등록하기';
  nameInput.value = ''; 
  
  alert('랭킹에 등록되었습니다!');
  await renderRankingTable();
  
  document.getElementById('gameover-modal').style.display = 'none';
  document.getElementById('ranking-modal').style.display = 'flex';
});
</script>
